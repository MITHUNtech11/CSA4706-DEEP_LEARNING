name: Hospital RAG RBAC Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Automated Testing & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed synthetic clinical database
        run: |
          python data/generate_data.py

      - name: Run Pytest Test Suite (36+ tests)
        run: |
          pytest tests/ -v --durations=10

      - name: Run Red-Teaming & Security Benchmark (0% Leakage Gate)
        run: |
          python scripts/run_security_eval.py
